[project]
name = "copilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["uagents==0.26.1", "python-dotenv>=1.0", "httpx>=0.27", "openai>=1.50"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
